[gcode_macro _USER_VARIABLES]
variable_bed_mesh_enabled: True
gcode:

# Also include directly the dockable probe overide of BED_MESH_CALIBRATE from here
[include ../../config/macros/base/probing/overrides/bed_mesh_calibrate.cfg]
# And also include the adaptive mesh macro at the same time
[include ../../config/macros/calibration/adaptive_bed_mesh.cfg]


[bed_mesh]
# speed: 600
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 275, 295
# probe_count: 9, 9
algorithm: bicubic
# bicubic_tension: 0.2
# mesh_pps: 2, 2
speed: 400
probe_count: 30, 30
move_check_distance: 3
split_delta_z: 0.025
fade_target: 0
fade_start: 0.5
fade_end: 1.5
zero_reference_position: 152.5, 152.5
