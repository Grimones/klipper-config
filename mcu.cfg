#---------------------------------------------#
#### BTT Manta M8P v1.1 MCU definition ########
#---------------------------------------------#

[mcu]
##--------------------------------------------------------------------
# This board works by using a serial connection by default. If you
# want to use CAN, invert the commented lines and use canbus_uuid.

# serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
canbus_uuid: ab8ba116102c
##--------------------------------------------------------------------

[include config/mcu_definitions/main/BTT_Manta_M8P_v1.1.cfg] # Do not remove this line
[board_pins mantam8p11_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_M1_STEP  , X_DIR=MCU_M1_DIR  , X_ENABLE=MCU_M1_EN  , X_TMCUART=MCU_M1_CS  ,
    Y_STEP=MCU_M2_STEP  , Y_DIR=MCU_M2_DIR  , Y_ENABLE=MCU_M2_EN  , Y_TMCUART=MCU_M2_CS  ,

    Z_STEP=MCU_M6_STEP  , Z_DIR=MCU_M6_DIR  , Z_ENABLE=MCU_M6_EN  , Z_TMCUART=MCU_M6_CS  ,
    Z1_STEP=MCU_M3_STEP , Z1_DIR=MCU_M3_DIR , Z1_ENABLE=MCU_M3_EN , Z1_TMCUART=MCU_M3_CS ,
    Z2_STEP=MCU_M4_STEP , Z2_DIR=MCU_M4_DIR , Z2_ENABLE=MCU_M4_EN , Z2_TMCUART=MCU_M4_CS ,
    Z3_STEP=MCU_M5_STEP , Z3_DIR=MCU_M5_DIR , Z3_ENABLE=MCU_M5_EN , Z3_TMCUART=MCU_M5_CS ,

    X_STOP=MCU_M1_STOP ,
    Y_STOP=MCU_M2_STOP ,

    BED_HEATER=MCU_BED_OUT , BED_TEMPERATURE=MCU_THB , BED_TEMPERATURE_BACKUP=MCU_TH0 ,

    CONTROLLER_FAN=MCU_FAN1 ,
    CONTROLLER_FAN2=MCU_FAN0 ,
    FILTER_FAN=MCU_FAN2 ,
    STEPPER_FAN=MCU_FAN3 ,
    # EXHAUST_FAN=MCU_FAN3 ,
    # HOST_CONTROLLER_FAN=MCU_FAN5 ,

    CHAMBER_TEMPERATURE_1=MCU_TH1 ,
    CHAMBER_TEMPERATURE_2=MCU_TH2 ,
    CHAMBER_TEMPERATURE_3=MCU_TH3 ,
    # ELECTRICAL_CABINET_TEMPERATURE=MCU_TH2 ,

    LIGHT_OUTPUT=MCU_HE1 ,
    # STATUS_NEOPIXEL=MCU_RGB1 ,
    # LIGHT_NEOPIXEL=MCU_RGB2 ,

    # SERVO_PIN=MCU_PROBE1 ,

#-------------------------------------------#
##### Mellow SHT36 v3 MCU definition ########
#-------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
canbus_uuid: 38f03b07bd6d
##--------------------------------------------------------------------

[include config/mcu_definitions/toolhead/Mellow_SHT36_v3.x.cfg]
[board_pins sht36v3_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_EXT_STEP , E_DIR=MCU_EXT_DIR , E_ENABLE=MCU_EXT_EN , E_TMCUART=MCU_EXT_UART ,

    # X_STOP=MCU_TH0             ,
    # PROBE_INPUT=MCU_LIMIT_0     ,

    E_HEATER=MCU_HE0 , CHAMBER_TEMPERATURE=gpio28 ,

    PART_FAN=MCU_FAN0 , E_FAN=MCU_FAN1 , # E_FAN_TACHO=MCU_LIMIT_1 ,

    STATUS_NEOPIXEL=MCU_RGBLED ,

    PT100=MCU_PT100 ,

    UNLOAD=MCU_PROBE_1 ,
    RUNOUT=MCU_LIMIT_0

