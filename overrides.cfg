#-------------------------#
#   START_PRINT SEQUENCE  #
#-------------------------#

## The START_PRINT sequence is modular and fully customizable. A default START_PRINT sequence is auto-populated based on
## your probe choice (TAP, Dockable, Inductive), but if for some reasons you still want to modify it, please uncomment the following 3
## lines to define a new `variable_startprint_actions`. You can use any number of action or even duplicate some actions if needed.
## Available actions: "bed_soak", "extruder_preheating", "chamber_soak", "extruder_heating", "tilt_calib", "z_offset", "bedmesh", "purge", "clean", "primeline"
##
# [gcode_macro _USER_VARIABLES]
# variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "clean", "tilt_calib", "z_offset", "bedmesh", "extruder_heating", "purge", "clean", "primeline"
# gcode: # do not remove this line


#-------------------------#
#   EXTRUDER/BED PIDs     #
#-------------------------#

[extruder]
sensor_type: MAX31865
sensor_pin: toolhead:PT100
spi_bus:spi0_gpio4_gpio3_gpio2
rtd_reference_r: 4300  ## Set to 430 for PT100, 4300 for PT1000
rtd_nominal_r: 1000  ## Set to 100 for PT100, 1000 for PT1000
# rtd_num_of_wires: 2
# SB2040 V2
# spi_software_sclk_pin: toolhead:PT100_SCK
# spi_software_mosi_pin: toolhead:PT100_MOSI
# spi_software_miso_pin: toolhead:PT100_MISO
# SHT36 v2 PT100
# sensor_type: MAX31865
# sensor_pin: toolhead:PT100
# spi_bus: spi2
# rtd_reference_r: 430
# rtd_nominal_r: 100
# rtd_num_of_wires: 2
# rtd_use_50Hz_filter: True
# SHT36 v2 PT1000
# pullup_resistor: 1100
# sensor_type: PT1000
# sensor_pin: toolhead:MCU_TH0

control: pid
pid_version: 1
pid_target: 250.00
pid_tolerance: 0.0200
pid_kp: 31.647
pid_ki: 9.173
pid_kd: 27.296

microsteps: 64
# Galileo v2
# rotation_distance: 48.1012
# gear_ratio: 9:1
# Moons CW2
# gear_ratio: 5:1
# rotation_distance: 22.99208
# Orbiter
rotation_distance: 4.71
full_steps_per_rotation: 200

nozzle_diameter: 0.400
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_cross_section: 5

min_extrude_temp: 0
min_temp: 0
max_temp: 320

pressure_advance: 0.03
pressure_advance_smooth_time: 0.02
per_move_pressure_advance: True

[heater_bed]
control: pid
pid_Kp: 38.823
pid_Ki: 0.275
pid_Kd: 1371.439
max_power: 0.6
sensor_type: ATC Semitec 104NT-4-R025H42G


#-------------------------#
#   Steppers              #
#-------------------------#

[stepper_x]
high_precision_step_compress: True
dir_pin: !X_DIR
homing_speed: 90
microsteps: 64
position_min: 0
position_endstop: 303
position_max: 303
# Sensorless
endstop_pin: tmc2209_stepper_x:virtual_endstop

[stepper_y]
high_precision_step_compress: True
dir_pin: !Y_DIR
homing_speed: 90
microsteps: 64
position_min: -6
position_endstop: 303
position_max: 303

[stepper_z]
dir_pin: !Z_DIR
position_max: 300
position_min: -10
microsteps: 64

[stepper_z1]
microsteps: 64

[stepper_z2]
dir_pin: !Z2_DIR
microsteps: 64

[stepper_z3]
microsteps: 64


#-------------------------#
#   Drivers               #
#-------------------------#

[tmc2209 extruder]
stealthchop_threshold: 0
interpolate: False
# Galileo V2
# run_current: 0.6
# Orbiter
# run_current: 0.85
# Moons
run_current: 0.55
[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
# motor: moons-cse14hra1l410a
tuning_goal: performance

[tmc2209 stepper_x]
stealthchop_threshold: 0
interpolate: False
run_current: 1.1
home_current: 0.8
# Sensorless
diag_pin: ^X_STOP
driver_SGTHRS: 255
[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ac
sg4_thrs: 100
tuning_goal: performance

[tmc2209 stepper_y]
stealthchop_threshold: 0
interpolate: False
run_current: 1.1
[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ac
tuning_goal: performance

[tmc2209 stepper_z]
stealthchop_threshold: 0
interpolate: False
run_current: 1.0
[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
tuning_goal: performance

[tmc2209 stepper_z1]
stealthchop_threshold: 0
interpolate: False
run_current: 1.0
[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1
tuning_goal: performance

[tmc2209 stepper_z2]
stealthchop_threshold: 0
interpolate: False
run_current: 1.0
[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1
tuning_goal: performance

[tmc2209 stepper_z3]
stealthchop_threshold: 0
interpolate: False
run_current: 1.0
[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1
tuning_goal: performance


#-------------------------#
#   Hardware              #
#-------------------------#

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 15000
max_z_velocity: 30
max_z_accel: 500
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

[scanner]
x_offset: 0
y_offset: 30
backlash_comp: 0.00521
mesh_runs: 2

# [probe]
# drop_first_result: True
# z_offset: -1.780

[temperature_sensor heater_bed_backup]
sensor_type: Generic 3950
sensor_pin: BED_TEMPERATURE_BACKUP
min_temp: 0
max_temp: 130

[temperature_sensor Chamber_Gantry_Left]
sensor_type: Generic 3950
sensor_pin: CHAMBER_TEMPERATURE_1

[temperature_sensor Chamber_Bottom_Right]
sensor_type: Generic 3950
sensor_pin: CHAMBER_TEMPERATURE_2

[temperature_sensor Chamber_Top_Left]
sensor_type: Generic 3950
sensor_pin: CHAMBER_TEMPERATURE_3

[temperature_sensor Chamber_Avg]
sensor_type: temperature_combined
sensor_list: temperature_sensor Chamber_Gantry_Left, temperature_sensor Chamber_Bottom_Right, temperature_sensor Chamber_Top_Left
combination_method: mean
maximum_deviation: 1000.0

[temperature_sensor Chamber_Toolhead]
sensor_type: Generic 3950
sensor_pin: toolhead:CHAMBER_TEMPERATURE

[temperature_sensor CB2_temp]
sensor_type: temperature_host

[controller_fan electronics]
pin: CONTROLLER_FAN
cycle_time: 0.12
max_power: 1
kick_start_time: 0.5
fan_speed: 0.9
idle_timeout: 60
stepper: stepper_x, stepper_y

[controller_fan ssr]
pin: CONTROLLER_FAN2
cycle_time: 0.1
max_power: 1
kick_start_time: 0.5
fan_speed: 0.9
idle_timeout: 60
heater: heater_bed

[controller_fan stepper]
pin: STEPPER_FAN
max_power: 0.5
kick_start_time: 0.250
off_below: 0.30
stepper: stepper_x, stepper_y

[output_pin ssr_relay]
pin: CB2:gpio8
value: 0

[output_pin caselight]
cycle_time: 0.0001

[adxl345]
axes_map: x,z,-y

#-------------------------#
#   Software              #
#-------------------------#

[shaketune]

# [settling_probe]
# settling_sample: True

[input_shaper]
enabled_extruders: extruder
shaper_type: smooth_mzv
smoother_freq_x: 67.6
smoother_freq_y: 45.8

[bed_mesh]
zero_reference_position: 151.50,151.50

[quad_gantry_level]
gantry_corners:
    -60,-10
    360,370
points:
	50,25
	50,225
	250,225
	250,25
speed: 500
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
adaptive_horizontal_move_z: True
min_horizontal_move_z: 5
max_adjust: 10

[resonance_tester]
accel_chip: adxl345
probe_points: 152.5, 152.5, 10


